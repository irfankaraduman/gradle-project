trigger: none

pool:
  name: 'irfank'

variables:
  FORTIFY_BUILD_ID: 'gradle'
  OUTPUT_FPR_FILE: 'gradle.fpr'
  BUILD_COMMAND: 'gradlew clean build'
  SSC_URL: 'https://192.168.13.177:8443/ssc/'
  SSC_APP_NAME: 'Gradle'
  SSC_APP_VERSION: 'azure-sca-scan'
  # Java 21 Dizini:
  JAVA_HOME_PATH: 'C:\Program Files\Amazon Corretto\jdk21.0.12_9'

stages:
  - stage: BuildCheck
    displayName: 'Gradle Build Check'
    jobs:
      - job: TestBuild
        displayName: 'Test Gradle Build'
        steps:
          - checkout: self
            clean: true

          - task: CmdLine@2
            displayName: 'Set Java 21 (JAVA_HOME)'
            inputs:
              script: |
                echo ##vso[task.setvariable variable=JAVA_HOME]$(JAVA_HOME_PATH)
                echo ##vso[task.prependpath]$(JAVA_HOME_PATH)\bin

          - task: CmdLine@2
            displayName: 'Check Java Version'
            inputs:
              script: 'java -version'

          - task: CmdLine@2
            displayName: 'Check Gradle Version'
            inputs:
              script: 'gradlew -v'

          - task: CmdLine@2
            displayName: 'Gradle Build'
            inputs:
              script: '$(BUILD_COMMAND)'

  - stage: SecurityScan
    displayName: 'Fortify Security Scan'
    dependsOn: BuildCheck
    jobs:
      - job: ScanJob
        displayName: 'Run Fortify Scan'
        steps:
          - checkout: self
            clean: true

          - task: CmdLine@2
            displayName: 'Set Java 21 (JAVA_HOME)'
            inputs:
              script: |
                echo ##vso[task.setvariable variable=JAVA_HOME]$(JAVA_HOME_PATH)
                echo ##vso[task.prependpath]$(JAVA_HOME_PATH)\bin

          - task: CmdLine@2
            displayName: 'Check Java Version'
            inputs:
              script: 'java -version'

          - task: CmdLine@2
            displayName: 'Fortify Clean'
            inputs:
              script: 'sourceanalyzer -b $(FORTIFY_BUILD_ID) -clean'

          - task: CmdLine@2
            displayName: 'Fortify Translate'
            inputs:
              script: 'sourceanalyzer -b $(FORTIFY_BUILD_ID) $(BUILD_COMMAND)'

          - task: CmdLine@2
            displayName: 'Fortify Scan'
            inputs:
              script: 'sourceanalyzer -b $(FORTIFY_BUILD_ID) -scan -f "$(System.DefaultWorkingDirectory)\$(OUTPUT_FPR_FILE)"'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish FPR Artifact'
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)\$(OUTPUT_FPR_FILE)'
              ArtifactName: 'FortifyScanResults'
              publishLocation: 'Container'

  - stage: UploadToSSC
    displayName: 'Upload Results to SSC'
    dependsOn: SecurityScan
    jobs:
      - job: UploadJob
        displayName: 'Fortify SSC Upload'
        steps:
          - checkout: none

          - task: DownloadBuildArtifacts@1
            displayName: 'Download FPR Artifact'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'FortifyScanResults'
              downloadPath: '$(System.DefaultWorkingDirectory)'

          - task: CmdLine@2
            displayName: 'Upload FPR to Fortify SSC'
            inputs:
              script: 'fortifyclient uploadFPR -url "$(SSC_URL)" -authtoken "$(FortifyAuthToken)" -file "$(System.DefaultWorkingDirectory)\FortifyScanResults\$(OUTPUT_FPR_FILE)" -application "$(SSC_APP_NAME)" -applicationVersion "$(SSC_APP_VERSION)"'
